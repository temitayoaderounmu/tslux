<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    FILE: pages/gallery.html
    PURPOSE:
    - Filterable gallery page for clients to browse styling inspiration.

    BEGINNER NOTES:
    - To add another gallery item, copy one figure.gallery-card block.
    - Update image path, alt text, title, caption, and category values.
    - Category values must match the filter button values in this file.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | tsLuxEvents</title>
  <meta name="description" content="View balloon decor, shimmer walls, mocktail styling, and dessert table inspiration from tsLuxEvents.">
  <!-- SHARE PREVIEW (Instagram, iMessage, Facebook, etc.): replace SITE-DOMAIN with the live domain -->

  <link rel="canonical" href="https://SITE-DOMAIN/pages/gallery.html">

  <meta property="og:type" content="website">

  <meta property="og:site_name" content="tsLuxEvents">

  <meta property="og:title" content="Gallery | tsLuxEvents">

  <meta property="og:description" content="View balloon decor, shimmer walls, mocktail styling, and dessert table inspiration from tsLuxEvents.">

  <meta property="og:url" content="https://SITE-DOMAIN/pages/gallery.html">

  <meta property="og:image" content="https://SITE-DOMAIN/assets/images/og-image.jpg">

  <meta property="og:image:width" content="1200">

  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../styles.css">
  <script src="../script.js" defer></script>
</head>
<body data-page="gallery" data-base="../">
  <div id="site-header"></div>

  <main id="main-content" class="section-shell">
    <section class="page-intro">
      <div class="page-intro__header">
        <div>
          <span class="eyebrow">Gallery</span>
          <h1>Browse event styling inspiration</h1>
        </div>
        <p>
          Explore looks for birthdays, graduations, showers, and intimate celebrations.
        </p>
      </div>
    </section>

    <section class="section-block section-block--last">
      <div class="filter-bar" aria-label="Gallery filters">
        <button class="filter-button is-active" type="button" data-filter-btn="all" aria-pressed="true">All</button>
        <button class="filter-button" type="button" data-filter-btn="balloon" aria-pressed="false">Balloon Decor</button>
        <button class="filter-button" type="button" data-filter-btn="shimmer" aria-pressed="false">Shimmer Wall</button>
        <button class="filter-button" type="button" data-filter-btn="mocktail" aria-pressed="false">Mocktail Bar</button>
        <button class="filter-button" type="button" data-filter-btn="dessert" aria-pressed="false">Dessert Styling</button>
      </div>

      <div class="gallery-grid">
        <figure class="gallery-card" data-gallery-card data-category="balloon">
          <img src="../assets/images/balloon1.jpg" alt="Organic balloon styling for a celebration" loading="lazy" decoding="async">
          <figcaption>
            <strong>Organic Balloon Install</strong>
            <span>Clean balloon styling for birthdays and intimate celebrations.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="balloon shimmer">
          <img src="../assets/images/purpleshimmer.jpeg" alt="Silver shimmer wall with purple balloon garlands and floral accents" loading="lazy" decoding="async">
          <figcaption>
            <strong>Purple Shimmer Backdrop</strong>
            <span>A silver shimmer wall accented with organic purple balloon garlands and elegant floral details.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="mocktail">
          <img src="../assets/images/mocktail.jpg" alt="Mocktail bar styling" loading="lazy" decoding="async">
          <figcaption>
            <strong>Styled Mocktail Station</strong>
            <span>A beverage feature that feels clean, pretty, and guest-ready.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="dessert">
          <img src="../assets/images/desert.JPG" alt="Dessert table styling with layered presentation" loading="lazy" decoding="async">
          <figcaption>
            <strong>Dessert Table Styling</strong>
            <span>Layered presentation for sweets, pastries, and table decor accents.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="balloon shimmer">
          <img src="../assets/images/custom.JPG" alt="Navy and silver balloon garland with a shimmer wall, neon Happy Birthday sign, and marquee number 10" loading="lazy" decoding="async">
          <figcaption>
            <strong>Navy &amp; Silver Milestone Backdrop</strong>
            <span>Navy and silver balloons, a shimmer wall, neon signage, and marquee numbers for a 10th birthday.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="balloon shimmer">
          <img src="../assets/images/purpleshimmer1.jpeg" alt="Purple draped shimmer wall with organic balloon garlands" loading="lazy" decoding="async">
          <figcaption>
            <strong>Purple Draped Shimmer Wall</strong>
            <span>Sheer purple draping over a shimmer wall, framed by lavender and violet balloon garlands.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="balloon">
          <img src="../assets/images/smileyarch.jpeg" alt="Pastel rainbow balloon arch with daisy accents" loading="lazy" decoding="async">
          <figcaption>
            <strong>Pastel Balloon Arch</strong>
            <span>A rainbow pastel balloon arch finished with daisy accents.</span>
          </figcaption>
        </figure>


        <figure class="gallery-card" data-gallery-card data-category="mocktail">
          <img src="../assets/images/mocktail1.jpg" alt="Outdoor mocktail bar with colorful drink dispensers, rimmed glasses, and cotton candy toppers" loading="lazy" decoding="async">
          <figcaption>
            <strong>Outdoor Mocktail Bar</strong>
            <span>Colorful drink dispensers, rimmed glasses, cotton candy toppers, and striped straws.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="mocktail">
          <img src="../assets/images/mocktail2.jpeg" alt="Two signature mocktail jars styled together" loading="lazy" decoding="async">
          <figcaption>
            <strong>Signature Drink Dispensers</strong>
            <span>Two signature mocktails served from ribbed dispensers on white risers.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="mocktail">
          <img src="../assets/images/mocktail3.jpeg" alt="Mocktail jars and drink pouches displayed on risers" loading="lazy" decoding="async">
          <figcaption>
            <strong>Grab-and-Go Mocktail Pouches</strong>
            <span>Drink pouches ready for guests beside a fruit punch dispenser.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="dessert">
          <img src="../assets/images/icecream.jpeg" alt="Styled ice cream bar setup" loading="lazy" decoding="async">
          <figcaption>
            <strong>Ice Cream Sundae Bar</strong>
            <span>Cones, toppings, sauces, and fresh strawberries set beside a graduation cake.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="dessert">
          <img src="../assets/images/icecream1.jpeg" alt="Ice cream bar detail from a side angle" loading="lazy" decoding="async">
          <figcaption>
            <strong>Sundae Toppings Spread</strong>
            <span>Sprinkles, candies, sauces, and strawberries ready for guests to build their own.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="dessert">
          <img src="../assets/images/icecream2.jpeg" alt="Two finished ice cream sundaes in polka-dot cups with wafer rolls" loading="lazy" decoding="async">
          <figcaption>
            <strong>Sundaes, Served</strong>
            <span>Polka-dot cups topped with wafer rolls and fresh strawberries.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="dessert">
          <img src="../assets/images/icecream3.jpeg" alt="Ice cream sundae with strawberries, sprinkles, and wafer rolls" loading="lazy" decoding="async">
          <figcaption>
            <strong>Strawberry Sundae Cup</strong>
            <span>A finished sundae with sprinkles, strawberries, and wafer rolls.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="dessert">
          <img src="../assets/images/fruitcup.jpg" alt="Fruit cup display for a dessert table" loading="lazy" decoding="async">
          <figcaption>
            <strong>Fresh Fruit Cups</strong>
            <span>Individually served fruit cups displayed on white risers.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="dessert">
          <img src="../assets/images/desert1.JPG" alt="Navy and gold birthday cake with tiered cookie stands and blue and silver balloons" loading="lazy" decoding="async">
          <figcaption>
            <strong>Birthday Cake &amp; Cookie Display</strong>
            <span>A navy and gold birthday cake with tiered cookie stands against blue and silver balloons.</span>
          </figcaption>
        </figure>

        <figure class="gallery-card" data-gallery-card data-category="dessert mocktail">
          <img src="../assets/images/desert2.jpeg" alt="Two-tier cake with styled beverage display" loading="lazy" decoding="async">
          <figcaption>
            <strong>Graduation Cake &amp; Drink Display</strong>
            <span>A two-tier graduation cake styled beside signature drink dispensers.</span>
          </figcaption>
        </figure>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
